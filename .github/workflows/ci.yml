name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          SITE_URL: https://ci.invalid
      - run: npm run check:links
      - run: npm run build
        env:
          SITE_URL: https://ci.invalid
          BASE_PATH: /dsh-handbook
      - run: npm run check:links
        env:
          BASE_PATH: /dsh-handbook
